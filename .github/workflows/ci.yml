name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Shipyard schema
        uses: actions/checkout@v4
        with:
          repository: tslateman/shipyard
          ref: main
          path: .shipyard

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pytest pyyaml
          pip install -e .

      - name: Lint (ruff check)
        run: ruff check src/ tests/

      - name: Format check (ruff format)
        run: ruff format --check src/ tests/

      - name: Test
        run: pytest
        env:
          SHIPYARD_SCHEMA: ${{ github.workspace }}/.shipyard/src/schema/fleet.sql
