[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis"
version = "0.1.0"
description = "Pragmatic leverage — operational synthesis over Lore"
requires-python = ">=3.10"
dependencies = ["PyYAML"]

[project.optional-dependencies]
spectrace = ["psycopg[binary]>=3.2,<4.0"]

[project.scripts]
praxis = "praxis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
